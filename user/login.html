<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Luxéora</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <!-- LOGO -->
            <div class="auth-logo">
                <a href="home.html">
                    <img src="assets/images/logo.png" alt="Luxéora">
                    <span>LUXÉORA</span>
                </a>
            </div>

            <p class="welcome-text">WELCOME BACK</p>

            <h1>Sign In</h1>

            <p class="auth-subtitle">
                Sign in to your Luxéora account
            </p>

            <!-- LOGIN FORM -->
            <form id="loginForm">

                <div class="form-group">
                    <label for="loginIdentifier">
                        Email or Phone Number
                    </label>

                    <input
                        type="text"
                        id="loginIdentifier"
                        placeholder="Enter your email or phone number"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div class="login-options">

                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>

                    <a href="#" id="forgotPassword">
                        Forgot Password?
                    </a>

                </div>

                <button type="submit" class="login-button">
                    LOGIN
                </button>

            </form>


            <!-- DIVIDER -->
            <div class="divider">
                <span>OR</span>
            </div>


            <!-- GOOGLE -->
            <button
                type="button"
                class="social-button"
                id="googleLogin"
            >
                <span class="social-icon">G</span>
                Continue with Google
            </button>


            <!-- FACEBOOK -->
            <button
                type="button"
                class="social-button"
                id="facebookLogin"
            >
                <span class="social-icon">f</span>
                Continue with Facebook
            </button>


            <!-- SIGN UP -->
            <p class="signup-text">
                Don't have an account?
                <a href="signup.html">
                    Sign up now
                </a>
            </p>


            <!-- HOME -->
            <a href="home.html" class="back-home">
                ← Back to Home
            </a>

        </div>

    </main>


    <script src="js/login.js"></script>

</body>

</html>
